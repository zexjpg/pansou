name: Build & Release (cross-platform)

# 自动构建 pansou 的跨平台可执行文件并发布为 Release。
#
# 本仓库（fork）在 fish2018/pansou 上游基础上带了一份“发布补丁”：
#   - CHANNELS 未设置时默认启用全部频道（config/default_channels.txt，111 个）
#   - ENABLED_PLUGINS 未设置时默认启用全部插件（开箱即全量）
# 因此发布的 exe 无需任何环境变量即可加载全部插件 + 全部频道。
#
# 上游跟踪：check 阶段检测上游最新提交；若本 fork 尚未发布该版本，则先把上游
# main 合并进本 fork main（保留发布补丁），再交叉编译并发布。
#
# 触发：每日 UTC 18:00 定时检查上游更新 / 手动触发（可 force）/ 本文件或构建脚本变更时。
on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）检查一次上游更新。
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build & release even if already published'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-release.yml'
      - 'scripts/build.sh'
      - 'config/config.go'
      - 'config/embed_channels.go'
      - 'config/default_channels.txt'
      - 'config/default_channels_test.go'

permissions:
  contents: write            # 创建 Release 并上传资产（GITHUB_TOKEN 自带，无需 PAT）

env:
  UPSTREAM: fish2018/pansou
  GOTOOLCHAIN: go1.25.0      # bytedance/sonic v1.14.0 最高支持到 Go 1.25，必须锁版本
  CGO_ENABLED: '0'           # 纯 Go 静态编译，免交叉编译器、无 libc 依赖

jobs:
  # 1) 检查上游是否有新提交 / 新 Release；并在需要时把上游合并进本 fork
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.detect.outputs.ref }}
      version: ${{ steps.detect.outputs.version }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Detect upstream update & sync fork
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "ci@workbuddy.local"
          git config user.name "WorkBuddy CI"

          # 上游最新 Release：用“列表接口”而非 /releases/latest，
          # 因为上游没有 Release 时 /latest 会返回 404，列表接口返回 []（HTTP 200）。
          rel=$(gh api "repos/$UPSTREAM/releases?per_page=1" --jq '.[0].tag_name // ""' 2>/dev/null) || rel=""
          # 上游最新提交
          commit=$(gh api "repos/$UPSTREAM/commits?per_page=1" --jq '.[0].sha' 2>/dev/null) || commit=""
          if [ -z "$commit" ]; then
            echo "::error::无法获取上游 $UPSTREAM 的最新提交" >&2
            exit 1
          fi
          if [ -n "$rel" ]; then
            version="$rel"
          else
            version="commit-${commit:0:7}"
          fi

          # 本仓库（fork）是否已发布过该版本
          if gh release view "$version" >/dev/null 2>&1; then
            should_build=false
          else
            should_build=true
          fi

          # 上游有新提交且本版本尚未发布：把上游合并进 fork main，保留发布补丁
          if [ "$should_build" = "true" ] && [ "$(git rev-parse HEAD)" != "$commit" ]; then
            git remote add upstream "https://github.com/$UPSTREAM.git" || true
            git fetch upstream main
            if ! git merge --no-edit upstream/main; then
              echo "::error::合并上游到 fork main 冲突，请手动解决" >&2
              git merge --abort || true
              exit 1
            fi
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

          {
            echo "ref=$commit"
            echo "version=$version"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"
          echo "detected ref=$commit version=$version should_build=$should_build"

  # 2) 矩阵交叉编译 6 个目标（构建的是带发布补丁的 fork main）
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - name: Checkout fork main (with release patch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh default channel list from upstream docker-compose
        run: |
          set -euo pipefail
          # 从（已合并上游的）docker-compose.yml 重新生成内嵌频道清单，
          # 让"默认全频道"自动跟随上游 CHANNELS 的变化。
          line=$(grep -m1 -o 'CHANNELS=.*' docker-compose.yml || true)
          if [ -z "$line" ]; then
            echo "::warning::docker-compose.yml 未找到 CHANNELS，保留现有 config/default_channels.txt"
            exit 0
          fi
          val="${line#CHANNELS=}"
          printf '%s' "$val" | tr ',' '\n' \
            | sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' | sort -u > config/default_channels.txt
          n=$(wc -l < config/default_channels.txt)
          if [ "$n" -lt 10 ]; then
            echo "::warning::提取到的频道过少($n)，判定为异常，回滚清单"
            git checkout -- config/default_channels.txt || true
          else
            echo "已刷新内嵌频道清单：$n 个"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          check-latest: true
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.check.outputs.version }}
          COMMIT: ${{ needs.check.outputs.ref }}
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pansou-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # 3) 汇总资产并发布 Release
  release:
    # 必须直接依赖 check，才能通过 needs.check.outputs 取到 version/ref
    # （needs 上下文只暴露“直接依赖”的输出，不含传递依赖）
    needs: [build, check]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pansou-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          ( cd artifacts && sha256sum * > sha256.txt )
          cat artifacts/sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          notes="Automated cross-platform build (fork $GITHUB_REPOSITORY, with all-plugins/all-channels default) of upstream $UPSTREAM @ $REF."
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$notes" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/*
